<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Confer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0c;
    --surface:#131316;
    --surface-raised:#1c1c21;
    --surface-strong:#25252c;
    --border:#2e2e38;
    --text:#f0f0f5;
    --text-secondary:#a0a0b0;
    --text-tertiary:#6e6e80;
    --text-muted:#4a4a5a;
    --danger:#dc4446;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono",Monaco,"Cascadia Code","Roboto Mono",monospace;
  }
  html,body{
    height:100%;
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .app{
    width:100%;
    height:100vh;
    max-width:100%;
    background:var(--surface);
    border-radius:0;
    border:1px solid var(--border);
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media(max-width:767px){
    .app{
      height:calc(100vh - 16px);
      border-radius:16px;
      margin:8px;
      width:calc(100% - 16px);
    }
  }

  /* Page routing */
  .page{display:none;width:100%;height:100%;flex-direction:column}
  #landing{display:flex}
  section:target~#landing{display:none}
  #auth:target,#main:target{display:flex}

  /* Landing */
  .landing-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 24px;text-align:center}
  .brand-icon{width:64px;height:64px;border-radius:18px;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
  .landing-body h1{font-size:32px;font-weight:600;color:var(--text);letter-spacing:-0.02em}
  .tagline{font-size:15px;color:var(--text-secondary);margin-bottom:8px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:280px;padding:14px 20px;border-radius:12px;
    border:1px solid transparent;font-size:16px;font-weight:500;
    text-decoration:none;cursor:pointer;transition:all .15s ease;
    color:var(--text);
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--text);color:var(--bg)}
  .btn-secondary{background:transparent;color:var(--text);border-color:var(--border)}
  .btn-ghost{background:transparent;color:var(--text-tertiary);font-size:13px;padding:8px;width:auto;max-width:none}
  .btn:hover{opacity:.85}

  /* Auth */
  .auth-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;max-width:360px;margin:0 auto;width:100%}
  .auth-head{width:100%;position:relative;text-align:center;margin-bottom:8px}
  .auth-head h2{font-size:20px;font-weight:600;color:var(--text)}
  .back-btn{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    color:var(--text-secondary);text-decoration:none;display:inline-flex;
    padding:6px;border-radius:10px;transition:background .15s ease;
  }
  .back-btn:hover{background:var(--surface-raised)}
  .code-input{
    width:100%;padding:16px 18px;font-size:22px;font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.3em;
    text-transform:uppercase;border:1.5px solid var(--border);border-radius:12px;
    background:var(--surface);color:var(--text);caret-color:var(--text);
    outline:none;transition:border-color .15s ease;
  }
  .code-input:focus{border-color:var(--text)}
  .code-input::placeholder{color:var(--text-muted);letter-spacing:normal;text-transform:none;font-family:var(--font-sans);font-size:15px}

  /* Main app */
  .shell{display:flex;flex-direction:column;height:100%}
  .tab-check{position:absolute;opacity:0;width:0;height:0}
  .app-header{
    display:flex;align-items:center;gap:12px;padding:12px 16px;
    border-bottom:1px solid var(--border);flex-shrink:0;
    background:var(--surface);
    z-index:10;
  }
  .call-info{flex:1;display:flex;flex-direction:column;gap:2px}
  .call-title{font-size:15px;font-weight:600;color:var(--text)}
  .call-time{font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}
  .header-toggle{
    display:flex;align-items:center;justify-content:center;width:36px;height:36px;
    border-radius:10px;color:var(--text-secondary);cursor:pointer;
    transition:background .15s ease;
  }
  .header-toggle:hover{background:var(--surface-raised)}
  .icon-video,.icon-msg{display:none}
  .tab-check:not(:checked)~.shell .icon-msg{display:block}
  .tab-check:checked~.shell .icon-video{display:block}

  .app-body{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

  /* Video pane - FaceTime style */
  .video-pane{
    display:flex;
    flex-direction:column;
    flex:1;
    background:#000;
    position:relative;
  }
  .video-stage{
    position:relative;
    flex:1;
    overflow:hidden;
    width:100%;
    height:100%;
  }
  #theirVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:var(--surface-strong);
  }
  #myVideo{
    position:absolute;
    bottom:16px;
    right:16px;
    width:28%;
    max-width:220px;
    min-width:110px;
    aspect-ratio:3/4;
    object-fit:cover;
    border-radius:14px;
    border:2px solid rgba(255,255,255,0.08);
    background:var(--surface-raised);
    box-shadow:0 8px 32px rgba(0,0,0,0.6);
  }
  .call-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding:16px;
    background:linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:5;
  }
  .ctrl{
    width:52px;height:52px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .08s ease,opacity .15s ease;
  }
  .ctrl:active{transform:scale(.9)}
  .ctrl-mute,.ctrl-cam{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(8px)}
  .ctrl-end{background:var(--danger);color:#fff}

  /* Messages pane */
  .messages-pane{display:none;flex-direction:column;flex:1;background:var(--surface)}
  .msg-list{
    flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;
    overscroll-behavior:contain;
  }
  .msg{display:flex}
  .msg-in{justify-content:flex-start}
  .msg-out{justify-content:flex-end}
  .bubble{
    max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45;
  }
  .msg-in .bubble{background:var(--surface-raised);color:var(--text);border-bottom-left-radius:4px}
  .msg-out .bubble{background:var(--text);color:var(--bg);border-bottom-right-radius:4px}
  .msg-input-bar{
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border);
  }
  .msg-input{
    flex:1;padding:11px 16px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:14px;outline:none;
    transition:border-color .15s ease;
  }
  .msg-input:focus{border-color:var(--text-secondary)}
  .msg-input::placeholder{color:var(--text-muted)}
  .send-btn{
    width:38px;height:38px;border-radius:50%;border:none;
    background:var(--text);color:var(--bg);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    transition:opacity .15s ease;
  }
  .send-btn:hover{opacity:.85}
  .send-btn svg{transform:rotate(90deg)}

  /* Mobile tabs */
  .mobile-tabs{display:flex;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
  .tab-label{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px;font-size:11px;color:var(--text-tertiary);cursor:pointer;
    transition:color .15s ease,background .15s ease;user-select:none;
  }
  .tab-label:hover{background:var(--surface-raised)}
  .tab-check:not(:checked)~.shell .mobile-tabs .tab-label[data-mode="video"]{color:var(--text);font-weight:600}
  .tab-check:checked~.shell .mobile-tabs .tab-label[data-mode="msg"]{color:var(--text);font-weight:600}

  .tab-check:not(:checked)~.shell .app-body .video-pane{display:flex}
  .tab-check:not(:checked)~.shell .app-body .messages-pane{display:none}
  .tab-check:checked~.shell .app-body .video-pane{display:none}
  .tab-check:checked~.shell .app-body .messages-pane{display:flex}

  /* Desktop merge */
  @media(min-width:768px){
    .mobile-tabs,.header-toggle{display:none}
    .app-body{flex-direction:row}
    .video-pane{flex:1.5;display:flex!important}
    .messages-pane{flex:1;max-width:420px;display:flex!important;border-left:1px solid var(--border)}
    #myVideo{
      width:22%;
      max-width:260px;
      min-width:150px;
      bottom:24px;
      right:24px;
      border-radius:16px;
    }
    .call-controls{padding-bottom:24px}
  }
</style>
</head>
<body>

<div class="app">

  <!-- AUTH PAGE -->
  <section id="auth" class="page">
    <div class="auth-body">
      <div class="auth-head">
        <a href="#" id="btn-back-auth" class="back-btn" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h2>Enter room code</h2>
      </div>
      <input id="input-code" class="code-input" type="text" placeholder="Enter 6-digit code" maxlength="8" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      <a href="#main" id="btn-verify" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Verify
      </a>
      <a href="#main" id="btn-skip" class="btn btn-ghost">Skip to app</a>
    </div>
  </section>

  <!-- MAIN APP -->
  <section id="main" class="page">
    <input type="checkbox" id="tab-msg" class="tab-check">
    <div class="shell">
      <header class="app-header">
        <a href="#" id="btn-back-main" class="back-btn" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="call-info">
          <span id="call-title" class="call-title">Team standup</span>
          <span id="call-timer" class="call-time">12:04</span>
        </div>
        <label for="tab-msg" id="toggle-view" class="header-toggle" aria-label="Toggle view">
          <svg class="icon-msg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <svg class="icon-video" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        </label>
      </header>

      <div class="app-body">
        <div class="video-pane">
          <div class="video-stage">
            <video id="theirVideo" autoplay playsinline></video>
            <video id="myVideo" autoplay playsinline muted></video>
          </div>
          <div class="call-controls">
            <button id="btn-mute" class="ctrl ctrl-mute" aria-label="Mute">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button id="btn-camera" class="ctrl ctrl-cam" aria-label="Camera">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            </button>
            <button id="btn-end" class="ctrl ctrl-end" aria-label="End call">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="messages-pane">
          <div id="msg-list" class="msg-list">
            <div class="msg msg-in"><div class="bubble">Hey, can you hear me?</div></div>
            <div class="msg msg-out"><div class="bubble">Yeah, loud and clear!</div></div>
            <div class="msg msg-in"><div class="bubble">Great, let's start the standup.</div></div>
            <div class="msg msg-out"><div class="bubble">I'm ready when you are.</div></div>
            <div class="msg msg-in"><div class="bubble">Did you see the new designs?</div></div>
            <div class="msg msg-out"><div class="bubble">Not yet, sending them over now.</div></div>
          </div>
          <div class="msg-input-bar">
            <input id="input-message" class="msg-input" type="text" placeholder="Type a message...">
            <button id="btn-send" class="send-btn" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="mobile-tabs">
        <label for="tab-msg" id="tab-video" class="tab-label" data-mode="video">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Video
        </label>
        <label for="tab-msg" id="tab-messages" class="tab-label" data-mode="msg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Messages
        </label>
      </div>
    </div>
  </section>

  <div id="landing" class="page">
    <div class="landing-body">
      <div class="brand-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </div>
      <h1>Confer</h1>
      <p class="tagline">Video calls and messaging, together.</p>
      <a href="#auth" id="btn-join" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Join room
      </a>
      <a href="#auth" id="btn-host" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Host room
      </a>
    </div>
  </div>

</div>

</body>
</html>
